<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Jay0130-a profile banner</title>
  <desc id="desc">AI Agent developer focused on Agent Runtime, Tool Calling, Skills, Eval and cross-platform engineering.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.55" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#f2cc60"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.42"/>
    </pattern>
  </defs>

  <rect width="1200" height="220" rx="10" fill="#0d1117"/>
  <rect width="1200" height="220" rx="10" fill="url(#grid)"/>
  <rect width="8" height="220" rx="4" fill="url(#accent)"/>

  <g font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace">
    <text x="48" y="66" fill="#7ee787" font-size="15" font-weight="700" letter-spacing="3">AI AGENT DEVELOPER</text>
    <text x="48" y="126" fill="#f0f6fc" font-size="50" font-weight="700">Jay0130-a</text>
    <text x="50" y="166" fill="#8b949e" font-size="16">Building reliable agent systems across real-world environments.</text>
    <text x="50" y="194" fill="#58a6ff" font-size="13" letter-spacing="1">RUNTIME / TOOL CALLING / SKILLS / EVAL / WINDOWS</text>
  </g>

  <g transform="translate(770 42)">
    <rect width="382" height="136" rx="10" fill="url(#panel)" stroke="#30363d"/>
    <circle cx="18" cy="18" r="4" fill="#ff7b72"/>
    <circle cx="32" cy="18" r="4" fill="#f2cc60"/>
    <circle cx="46" cy="18" r="4" fill="#3fb950"/>
    <path d="M18 36 H364" stroke="#30363d"/>
    <g font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13">
      <text x="18" y="59" fill="#8b949e">agent-runtime/</text>
      <text x="18" y="81" fill="#c9d1d9">tool-calling: <tspan fill="#7ee787">stable</tspan></text>
      <text x="18" y="103" fill="#c9d1d9">skills: <tspan fill="#58a6ff">contract-driven</tspan></text>
      <text x="18" y="125" fill="#c9d1d9">eval: <tspan fill="#f2cc60">reproduce -&gt; fix -&gt; guard</tspan></text>
    </g>
  </g>
</svg>
